<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

  <style>
    :root {
      --color-primary: #0f766e;
      --color-primary-dark: #0b5d57;
      --color-primary-light: #e0f2f1;
      --color-bg: #f7fbfa;
      --color-surface: #ffffff;
      --color-text: #1f2d33;
      --color-text-muted: #5c6b72;
      --color-border: #dbe7eb;
      --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      --max-width: 960px;
      --radius: 14px;
      --shadow-sm: 0 2px 8px rgba(15, 118, 110, 0.08);
      --shadow-md: 0 8px 28px rgba(15, 118, 110, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-base);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; height: auto; display: block; }

    a { color: var(--color-primary-dark); }

    a:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin-inline: auto;
      padding-inline: 1.25rem;
    }

    section { padding-block: 3.5rem; }

    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .section-subtitle {
      text-align: center;
      color: var(--color-text-muted);
      margin-bottom: 2rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 0.75rem;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-primary-dark);
      text-decoration: none;
    }

    .lang-switch {
      min-height: 44px;
      padding: 0.5rem 0.6rem;
      font-size: 0.9rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #0891b2 100%);
      color: #ffffff;
      text-align: center;
      padding-block: 5rem 5.5rem;
    }

    .hero-inner { max-width: 720px; margin-inline: auto; }

    .hero h1 {
      font-size: 2rem;
      line-height: 1.3;
      margin-bottom: 1.25rem;
    }

    .hero p {
      font-size: 1.05rem;
      opacity: 0.95;
    }

    @media (min-width: 768px) {
      .hero { padding-block: 6.5rem; }
      .hero h1 { font-size: 2.75rem; }
    }

    .cards {
      display: grid;
      gap: 1.25rem;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .card h3 { margin-bottom: 0.5rem; font-size: 1.15rem; }
    .card p { color: var(--color-text-muted); font-size: 0.95rem; }

    @media (min-width: 720px) {
      .cards { grid-template-columns: repeat(3, 1fr); }
    }

    .site-footer {
      background: #1f2d33;
      color: #dddddd;
      text-align: center;
      padding-block: 2rem;
      font-size: 0.9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section id="hero" class="hero">
      <div class="container hero-inner">
        <h1 data-i18n="hero.tagline">專為澳門本地商戶打造手機優先三語官方網站</h1>
        <p data-i18n="hero.subtitle">我們協助澳門本地商戶建立現代化官方網站，以手機優先設計、繁中/英/葡三語與 WhatsApp 預約整合，提升線上曝光與顧客信賴。</p>
      </div>
    </section>

    <section id="services">
      <div class="container">
        <h2 class="section-title" data-i18n="services.title">我們的服務</h2>
        <p class="section-subtitle" data-i18n="services.subtitle">專注澳門本地商戶的數位化方案</p>
        <div class="cards">
          <article class="card">
            <h3 data-i18n="service1.title">手機優先響應式設計</h3>
            <p data-i18n="service1.desc">以手機為核心設計，平板與桌面逐步增強，任何裝置都能順暢瀏覽。</p>
          </article>
          <article class="card">
            <h3 data-i18n="service2.title">三語在地化</h3>
            <p data-i18n="service2.desc">繁體中文、英文、葡文一鍵切換，符合澳門多語使用習慣。</p>
          </article>
          <article class="card">
            <h3 data-i18n="service3.title">WhatsApp 預約與地圖整合</h3>
            <p data-i18n="service3.desc">整合 WhatsApp 浮動預約按鈕、Google 地圖與 SEO 結構化資料。</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.rights">© 2026 澳門本地商戶數位化網頁工作室。版權所有。</p>
    </div>
  </footer>

  <script>
  (function () {
    "use strict";

    var translations = {
      "zh-Hant": {
        "page.title": "澳門本地商戶數位化網頁工作室",
        "brand.name": "澳門商戶網頁工作室",
        "lang.label": "選擇語言",
        "hero.tagline": "專為澳門本地商戶打造手機優先三語官方網站",
        "hero.subtitle": "我們協助澳門本地商戶建立現代化官方網站，以手機優先設計、繁中/英/葡三語與 WhatsApp 預約整合，提升線上曝光與顧客信賴。",
        "services.title": "我們的服務",
        "services.subtitle": "專注澳門本地商戶的數位化方案",
        "service1.title": "手機優先響應式設計",
        "service1.desc": "以手機為核心設計，平板與桌面逐步增強，任何裝置都能順暢瀏覽。",
        "service2.title": "三語在地化",
        "service2.desc": "繁體中文、英文、葡文一鍵切換，符合澳門多語使用習慣。",
        "service3.title": "WhatsApp 預約與地圖整合",
        "service3.desc": "整合 WhatsApp 浮動預約按鈕、Google 地圖與 SEO 結構化資料。",
        "footer.rights": "© 2026 澳門本地商戶數位化網頁工作室。版權所有。"
      },
      "en": {
        "page.title": "Macau Local Merchant Web Studio",
        "brand.name": "Macau Merchant Web Studio",
        "lang.label": "Select language",
        "hero.tagline": "Mobile-first trilingual official websites built for Macau local merchants",
        "hero.subtitle": "We help Macau local merchants build modern official websites with mobile-first design, Traditional Chinese / English / Portuguese, and WhatsApp booking integration to boost online presence and customer trust.",
        "services.title": "Our Services",
        "services.subtitle": "Digital solutions focused on Macau local merchants",
        "service1.title": "Mobile-First Responsive Design",
        "service1.desc": "Designed mobile-first with progressive enhancement for tablet and desktop — smooth on every device.",
        "service2.title": "Trilingual Localisation",
        "service2.desc": "One-tap switching between Traditional Chinese, English and Portuguese to suit Macau's multilingual habits.",
        "service3.title": "WhatsApp Booking & Map Integration",
        "service3.desc": "Integrated WhatsApp floating booking button, Google Maps and SEO structured data.",
        "footer.rights": "© 2026 Macau Local Merchant Web Studio. All rights reserved."
      },
      "pt": {
        "page.title": "Estúdio Web para Comerciantes Locais de Macau",
        "brand.name": "Estúdio Web para Comerciantes de Macau",
        "lang.label": "Selecionar idioma",
        "hero.tagline": "Websites oficiais trilíngues e mobile-first para comerciantes locais de Macau",
        "hero.subtitle": "Ajudamos comerciantes locais de Macau a criar websites oficiais modernos, com design mobile-first, chinês tradicional / inglês / português e integração com WhatsApp para marcações.",
        "services.title": "Os Nossos Serviços",
        "services.subtitle": "Soluções digitais focadas nos comerciantes locais de Macau",
        "service1.title": "Design Responsivo Mobile-First",
        "service1.desc": "Design centrado no telemóvel, com melhoramento progressivo para tablet e desktop — fluido em qualquer dispositivo.",
        "service2.title": "Localização Trilíngue",
        "service2.desc": "Alternância instantânea entre chinês tradicional, inglês e português, adequada aos hábitos multilingues de Macau.",
        "service3.title": "Marcação via WhatsApp & Integração de Mapa",
        "service3.desc": "Botão flutuante de marcação via WhatsApp, Google Maps e dados estruturados para SEO.",
        "footer.rights": "© 2026 Estúdio Web para Comerciantes Locais de Macau. Todos os direitos reservados."
      }
    };

    function applyLanguage(lang) {
      if (!translations[lang]) { lang = "zh-Hant"; }

      document.documentElement.lang = lang;
      if (translations[lang]["page.title"]) {
        document.title = translations[lang]["page.title"];
      }

      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      var select = document.getElementById("lang-switch");
      if (select) { select.value = lang; }

      try {
        localStorage.setItem("lang", lang);
      } catch (e) {}
    }

    function initLanguage() {
      var saved = "zh-Hant";
      try {
        saved = localStorage.getItem("lang") || "zh-Hant";
      } catch (e) {}
      applyLanguage(saved);
    }

    document.addEventListener("DOMContentLoaded", function () {
      initLanguage();

      var select = document.getElementById("lang-switch");
      if (select) {
        select.addEventListener("change", function () {
          applyLanguage(select.value);
        });
      }
    });
  })();
  </script>

</body>
</html>
